<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Squad CC</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071330;
color:#fff;
}

header{
background:#111;
padding:20px;
text-align:center;
border-bottom:3px solid gold;
}

header h1{
font-size:38px;
color:#00E5FF;
}

header p{
margin-top:10px;

}

.hero{
padding:70px 20px;
text-align:center;
}

.hero h2{
font-size:45px;
color:#00E5FF;
}

.hero p{
margin:20px 0;

}

button{
padding:15px 30px;
background:gold;
border:none;
border-radius:8px;

font-weight:bold;

}

.card{

margin:20px;
padding:20px;

}

.card h3{

margin-bottom:15px;

footer{

padding:20px;

<section class="hero">

</section>

<div class="card">
<h3>Latest Match</h3>

<p>Apex CC vs Black Squad</p>

</div>

<div class="card">

</div>

<footer>

© 2026 BLACK SQUAD CC

</footer>
